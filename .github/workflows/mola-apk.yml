name: Mola sadece TV ve Radyo APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: "true"
    steps:
      - name: Kisisel projeyi al
        uses: actions/checkout@v4
        with:
          path: personal

      - name: Mola orijinal GitHub kaynaklarini al (2.2.2)
        uses: actions/checkout@v4
        with:
          repository: moris545454/araba-
          ref: 3f45ad3557a25822c2a3a9f152f32ef82f57e005
          path: personal/upstream
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kisisel degisiklikleri uygula
        working-directory: personal
        run: |
          python3 scripts/patch_media_only.py
          test "$(grep -c '^#EXTINF' iptv/tv.m3u)" -eq 54
          test "$(grep -c '^#EXTINF' iptv/radio.m3u)" -eq 19

      - name: APK derle
        working-directory: personal/upstream
        run: |
          bash gradlew :fermata:packageAutoDebugUniversalApk -PAPP_ID=me.app.molakisisel --no-daemon --stacktrace --console=plain

      - name: Yalniz TV ve Radyo kaynaklarinin degistigini denetle
        working-directory: personal/upstream
        run: |
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if not changed:
              raise SystemExit("Kaynak degisiklikleri yok")
          bad = [p for p in changed if not p.startswith(("modules/tv/", "modules/radio/"))]
          if bad:
              raise SystemExit("TV/radyo disinda kaynak degistirildi: " + str(bad))
          new = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          extra = [p for p in new if not p.startswith(("modules/tv/", "modules/radio/"))]
          if extra:
              raise SystemExit("TV/radyo disinda yeni kaynak var: " + str(extra))
          print("Dogrulandi: TV ve radyo disindaki kaynak dosyalari orijinal")
          print("Degisen dosyalar:", changed)
          print("Yeni medya listeleri:", new)
          PY

      - name: APK dosyasini bul ve imzayi dogrula
        working-directory: personal/upstream
        run: |
          set -euo pipefail
          mkdir -p ../../out
          find fermata/build/outputs -type f -name '*universal.apk' -print
          apk="$(find fermata/build/outputs -type f -name '*universal.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" ../../out/Mola-TV-Radyo-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs ../../out/Mola-TV-Radyo-test.apk
          (cd ../../out && sha256sum Mola-TV-Radyo-test.apk > sha256.txt)

      - name: APK artifactini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Mola-TV-Radyo-test
          path: out/
          if-no-files-found: error

      - name: Ozel depoda test surumunu yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd personal
          tag="test-${GITHUB_SHA:0:8}"
          gh release create "$tag" ../out/Mola-TV-Radyo-test.apk ../out/sha256.txt --target "$GITHUB_SHA" --prerelease --title "Mola TV Radyo Kaynak Testi ${GITHUB_SHA:0:8}" --notes "Yalniz 54 TV ve 19 radyo kaynaklari degistirildi. Android Auto, root, oynatici ve kurulum kaynaklari aynen korundu. Orijinal GitHub v4.1.10 etiketi 2.2.2 kaynak commitine isaret eder; bu derleme 4.1.10 APKsinin aynisi degildir."
